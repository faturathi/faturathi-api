components:
  schemas:
    CompanyGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        group_vatin:
          type: string
          maxLength: 14
      required:
      - group_vatin
      - id
      - name
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        vatin:
          type: string
          maxLength: 14
        peppol_endpoint:
          type: string
          maxLength: 30
        is_walkin:
          type: boolean
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 20
        billing_address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 60
        postal_code:
          type: string
          maxLength: 10
        country_code:
          type: string
          maxLength: 2
        company:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - id
      - name
      - updated_at
    DirectionEnum:
      enum:
      - AR
      - AP
      type: string
      description: |-
        * `AR` - AR / Sales
        * `AP` - AP / Purchase
    DocTypeEnum:
      enum:
      - '380'
      - '381'
      - '383'
      - '389'
      - '261'
      type: string
      description: |-
        * `380` - Standard Tax Invoice
        * `381` - Credit Note
        * `383` - Debit Note
        * `389` - Self-Billed Invoice
        * `261` - Self-Billed Credit Note
    Document:
      type: object
      description: Full internal representation with writable nested lines. Persists
        via recompute_totals.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        doc_type:
          allOf:
          - $ref: '#/components/schemas/DocTypeEnum'
          readOnly: true
        is_b2c:
          type: boolean
          readOnly: true
        is_export:
          type: boolean
        invoice_number:
          type: string
          maxLength: 40
        uuid_v5:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        transaction_type_code:
          type: string
          maxLength: 20
        issue_date:
          type: string
          format: date
        issue_time:
          type: string
          format: time
        due_date:
          type: string
          format: date
          nullable: true
        tax_point_date:
          type: string
          format: date
          nullable: true
        customer:
          type: string
          format: uuid
          nullable: true
        counterparty_name:
          type: string
          maxLength: 200
        counterparty_vatin:
          type: string
          maxLength: 14
        counterparty_endpoint:
          type: string
          maxLength: 30
        currency:
          type: string
          maxLength: 3
        line_extension_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        allowance_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        charge_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        tax_exclusive_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        tax_inclusive_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        payable_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        payment_means_code:
          $ref: '#/components/schemas/PaymentMeansCodeEnum'
        payment_iban:
          type: string
          maxLength: 34
        payment_terms:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/DocumentStatusEnum'
        billing_reference:
          type: string
          format: uuid
          nullable: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        notes:
          type: string
          maxLength: 255
        ap_status:
          type: string
          maxLength: 40
        erp_system:
          type: string
          maxLength: 40
        extra_data: {}
        company:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
