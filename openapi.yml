  /api/invoices:
    get:
      operationId: invoices_list
      description: /api/invoices — plain-array list, invoice_number-keyed lookups
        (matches faturathi-ui).
      tags:
      - invoices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
