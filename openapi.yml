openapi: 3.0.3
info:
  title: Faturathi SaaS e-Invoicing API
  version: 1.0.0
  description: Tenant-isolated Oman PINT-OM billing, document ingestion, reporting
    and Peppol lifecycle API.
paths:
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: 'POST /api/auth/login/ -> tokens, or {"mfa_required": true} for
        mfa_enabled users.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApi'
          description: ''
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApi'
          description: ''
  /api/auth/mfa-verify:
    post:
      operationId: auth_mfa_verify_create
      description: 'POST /api/auth/mfa-verify/ email + otp (simulated: always DEMO_MFA_OTP)
        -> tokens.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApi'
          description: ''
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/clear:
    post:
      operationId: clear_create
      description: POST /api/config/reset-seeds/ (aliased at /api/reset-db, /api/clear)
        — wipes + reseeds demo data.
      tags:
      - clear
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericApi'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenericApi'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenericApi'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApi'
          description: ''
  /api/company-groups:
    get:
      operationId: company_groups_list
      description: |-
        Our own company-group lookup. NOTE: /api/vat-groups is reserved for VAT rate
        categories (see apps.utils.constants.VAT_CATEGORIES / reports app), not this model.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - company-groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyGroupList'
          description: ''
    post:
      operationId: company_groups_create
      description: |-
        Our own company-group lookup. NOTE: /api/vat-groups is reserved for VAT rate
        categories (see apps.utils.constants.VAT_CATEGORIES / reports app), not this model.
      tags:
      - company-groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyGroup'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyGroup'
          description: ''
  /api/company-groups/{id}:
