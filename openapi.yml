      operationId: company_groups_retrieve
      description: |-
        Our own company-group lookup. NOTE: /api/vat-groups is reserved for VAT rate
        categories (see apps.utils.constants.VAT_CATEGORIES / reports app), not this model.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this company group.
        required: true
      tags:
      - company-groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyGroup'
          description: ''
    put:
      operationId: company_groups_update
      description: |-
        Our own company-group lookup. NOTE: /api/vat-groups is reserved for VAT rate
        categories (see apps.utils.constants.VAT_CATEGORIES / reports app), not this model.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this company group.
        required: true
      tags:
      - company-groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyGroup'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyGroup'
          description: ''
    patch:
      operationId: company_groups_partial_update
      description: |-
        Our own company-group lookup. NOTE: /api/vat-groups is reserved for VAT rate
        categories (see apps.utils.constants.VAT_CATEGORIES / reports app), not this model.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this company group.
        required: true
      tags:
      - company-groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyGroup'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyGroup'
          description: ''
    delete:
      operationId: company_groups_destroy
      description: |-
        Our own company-group lookup. NOTE: /api/vat-groups is reserved for VAT rate
        categories (see apps.utils.constants.VAT_CATEGORIES / reports app), not this model.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this company group.
        required: true
      tags:
      - company-groups
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
